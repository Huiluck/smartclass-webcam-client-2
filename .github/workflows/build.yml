name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# All action references are pinned to a commit SHA; the comment carries the version.
env:
  CARGO_TERM_COLOR: always

jobs:
  linux-windows:
    # One Ubuntu runner builds both the native Linux target and the Windows
    # target (cross via cargo-xwin: clang-cl + the MSVC SDK fetched by xwin,
    # no Windows runner/container needed).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (stable + windows-msvc target)
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add x86_64-pc-windows-msvc

      - name: Install Linux system deps (VAAPI headers for the capture backend)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libva-dev

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2

      # Cache the cargo-xwin binary and the xwin MSVC SDK (~1.5 GB unpacked) so
      # it is fetched once per version, not per run. The repo cache budget is
      # 10 GB; this plus the rust caches stays well below it.
      - name: Cache cargo-xwin + xwin SDK
        id: xwin-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-xwin
            ~/.cache/xwin
          key: xwin-0.23.1-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo-xwin (static musl binary)
        if: steps.xwin-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL https://github.com/rust-cross/cargo-xwin/releases/download/v0.23.1/cargo-xwin-v0.23.1.x86_64-unknown-linux-musl.tar.gz | tar xz
          install -m755 cargo-xwin ~/.cargo/bin/cargo-xwin

      - name: Build workspace (Linux)
        run: cargo build --workspace --examples --locked

      - name: Unit tests (Linux)
        # scwc-e2e is excluded: its tests boot PostgreSQL + the server and are
        # exercised on developer machines, not here.
        run: cargo test --workspace --exclude scwc-e2e --locked

      - name: Build workspace (Windows, cross)
        run: cargo xwin build --workspace --target x86_64-pc-windows-msvc --locked

  apple:
    # macOS and iOS require the Apple SDKs; there is no legal/practical cross
    # path, so this one job uses a macOS runner.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (stable + iOS target)
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-ios

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2

      - name: Build workspace (macOS)
        run: cargo build --workspace --examples --locked

      - name: Check capture backend (iOS)
        run: cargo check -p scwc-capture --target aarch64-apple-ios --locked

      - name: Unit tests (macOS)
        run: cargo test --workspace --exclude scwc-e2e --locked

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Build Flutter app (macOS)
        run: flutter build macos --debug
        working-directory: app

  # Android: one Linux runner builds the capture backend for arm64. The runner image ships the
  # Android SDK, and its newest NDK is what the Rust target needs for a C toolchain — `ring`
  # (through rustls) is the only dependency that compiles C — and for the `cc`-driven link
  # check that the Apple job does natively for iOS.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (stable + Android target)
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2

      - name: Check capture backend (Android)
        run: |
          # The API level the toolchain targets does not change what the Rust code may call;
          # it is the level the NDK's own headers and stubs are cut at, so the newest one the
          # image carries is the right choice.
          BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$BIN/aarch64-linux-android35-clang"
          export AR_aarch64_linux_android="$BIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$BIN/aarch64-linux-android35-clang"
          cargo check -p scwc-capture --target aarch64-linux-android --all-targets --locked

  # TODO(android): the apk side of the client (`flutter build apk --debug` with the Rust core
  # in `jniLibs`) belongs to the Flutter-shell milestone; this job checks the capture backend
  # only.
