[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
# Async runtime and networking (used by crates/net in later milestones).
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.26"
reqwest = { version = "0.12", default-features = false, features = [
    "http2",
    "json",
    "rustls-tls",
] }
# WebSocket plumbing and zero-copy media buffers (used by crates/core).
futures-util = { version = "0.3", default-features = false, features = [
    "std",
    "sink",
] }
bytes = "1"
ulid = "1"
# Synthetic test-pattern encoder (crates/cli).
openh264 = "0.8"
# Still-image encoding for the photo channel (crates/cli).
jpeg-encoder = "0.7"

# Shared building blocks.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
# Headless binary plumbing (crates/cli).
clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
