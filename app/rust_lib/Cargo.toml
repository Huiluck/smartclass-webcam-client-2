[package]
name = "rust_lib"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"

# The device client itself; this crate only bridges it to Dart.
scwc-core = { path = "../../crates/core" }
scwc-capture = { path = "../../crates/capture" }
scwc-protocol = { path = "../../crates/protocol" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
