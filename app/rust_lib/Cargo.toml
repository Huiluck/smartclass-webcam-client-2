[package]
name = "rust_lib"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"

# The device client itself; this crate only bridges it to Dart.
scwc-core = { path = "../../crates/core" }
scwc-capture = { path = "../../crates/capture" }
scwc-protocol = { path = "../../crates/protocol" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

# The crates log through tracing, which does nothing without a subscriber; the app installs one.
tracing = "0.1"
tracing-subscriber = "0.3"

# The `wss://` attach runs on rustls 0.23, whose crypto provider is chosen at build time. This
# crate installs it at init (see `install_crypto_provider`) and therefore names both the crate
# and the provider: `ring`, the one `scwc-core` selects for the same reason — no cmake, and
# already in the dependency graph.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

# The server identity the UI stores lives in a JSON file next to the core's capture state.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Platform configuration directory for the capture-parameter state the core persists.
dirs = "6"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# iOS fix: backtrace's apple "libs_macos" code calls libc's `_dyld_*` functions,
# which libc now only exposes on macOS (it gates them with target_os = "macos").
# The vendored copy declares them as plain externs instead; see the
# SCWC PATCH comment in third_party/backtrace/src/symbolize/gimli/libs_macos.rs.
# Drop this once rust-lang/backtrace-rs supports non-macOS Apple targets.
[patch.crates-io]
backtrace = { path = "../../third_party/backtrace" }
